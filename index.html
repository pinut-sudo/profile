        <div></div>

        <!-- Center Cylinder Carousel -->
        <div class="carousel-section">
            <div class="carousel-container" id="carousel-stage">

                <!-- Dynamic Slides (0..3) -->
                <div class="carousel-slide" data-index="0" id="slide-0">
                    <div class="slide-card">
                        <img src="https://img.youtube.com/vi/niPkap1ozUA/maxresdefault.jpg" alt="MAKING MY WAY"
                            class="slide-img">
                        <div class="card-overlay"></div>
                    </div>
                </div>
                <div class="carousel-slide" data-index="1" id="slide-1">
                    <div class="slide-card">
                        <img src="https://img.youtube.com/vi/_uDDSFzrheY/maxresdefault.jpg" alt="THE WAY LIFE GOES"
                            class="slide-img">
                        <div class="card-overlay"></div>
                    </div>
                </div>
                <div class="carousel-slide" data-index="2" id="slide-2">
                    <div class="slide-card">
                        <img src="https://img.youtube.com/vi/7s1033v2DTQ/maxresdefault.jpg" alt="DOUBT"

                        <div class="card-overlay"></div>

                <div class="carousel-slide" data-index="3" id="slide-3">
                    <div class="slide-card">
                        <img src="https://img.youtube.com/vi/FriPUsEsxc8/maxresdefault.jpg" alt="SHE GOES BY"
                            class="slide-img">
                        <div class="card-overlay"></div>
                    </div>
                </div>

                <!-- Central Card Info overlay: Text details -->
                <div class="center-card-overlay">
                    <div class="overlay-bounds">
                        <!-- Bottom-left details panel inside center card zone -->
                        <div class="card-info-panel" id="meta-panel">
                            <h2 class="track-title" id="meta-title">
                                MAKING MY WAY
                            </h2>
                            <button class="btn-launch" id="btn-launch">
                                PLAY TRACK
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom Controller Bar -->
        <div class="bottom-controller-bar">
            <!-- Timeline & Volume (Simple bottom-left audio controller) -->
            <div class="timeline-container">
                <div class="timeline-meta">
                    <span id="time-current">0:00</span>
                    <span id="track-artist-bottom">SƠN TÙNG M-TP</span>
                    <span id="time-duration">0:00</span>
                </div>
                <div class="controls-row">
                    <div class="progress-bar-wrapper" id="progress-container">
                        <canvas id="timeline-visualizer" class="timeline-visualizer-canvas"></canvas>
                        <div class="progress-bar-fill" id="progress-bar"></div>
                        <div class="progress-handle" id="progress-handle"></div>
                    </div>
                    <div class="volume-controller">
                        <button class="volume-btn" id="volume-btn" title="Mute/Unmute">
                            <svg class="volume-icon" id="volume-icon" viewBox="0 0 24 24">
                                <path fill="currentColor"
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />

                            <div class="volume-slider-fill" id="volume-bar" style="width: 80%;"></div>
                            <div class="volume-handle" id="volume-handle" style="left: 80%;"></div>
                        </div>
                    </div>
                </div>
            </div>

                    <button class="thumb-btn" data-index="1">

                    <button class="thumb-btn" data-index="2">

                    <button class="thumb-btn" data-index="3">
